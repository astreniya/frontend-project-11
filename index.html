<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS агрегатор</title>
</head>
<body class="flex min-h-screen flex-col bg-gray-50 text-gray-900">
<main class="flex-grow">
  <section class="bg-slate-900 py-12 text-white">
    <div class="mx-auto max-w-3xl px-4">
      <h1 class="text-4xl font-bold tracking-tight">RSS агрегатор</h1>
      <p class="mt-2 text-lg text-slate-300">
        Начните читать RSS сегодня! Это легко, это красиво.
      </p>

      <form class="mt-6 flex flex-col gap-3 sm:flex-row" novalidate>
        <div class="flex-grow">
          <label for="url-input" class="sr-only">Ссылка RSS</label>
          <input
                  id="url-input"
                  name="url"
                  type="url"
                  required
                  autofocus
                  placeholder="Ссылка RSS"
                  aria-label="url"
                  autocomplete="off"
                  class="w-full rounded-lg border-2 border-gray-300 bg-white px-4 py-3 text-gray-900 shadow-sm focus:border-blue-500 focus:ring-0"
          />
        </div>
        <button
                type="submit"
                aria-label="add"
                class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white shadow-sm hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900"
        >
          Добавить
        </button>
      </form>

      <p class="mt-2 text-sm text-slate-400">
        Пример: https://hexlet.app
      </p>
      <p id="feedback" class="mt-2 min-h-6 text-sm"></p>
    </div>
  </section>

  <section class="mx-auto w-full max-w-5xl px-4 py-8">
    <div class="grid grid-cols-1 gap-8 md:grid-cols-3">
      <div id="posts" class="md:col-span-2"></div>
      <div id="feeds"></div>
    </div>
  </section>
</main>

<dialog
        id="modal"
        class="m-auto w-full max-w-lg rounded-lg bg-white p-0 text-gray-900 shadow-xl backdrop:bg-black/50"
>
  <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
    <h3 id="modal-title" class="text-lg font-bold text-gray-900"></h3>
    <button
            type="button"
            data-modal-close
            aria-label="Close"
            class="text-2xl leading-none text-gray-400 hover:text-gray-600"
    >
      &times;
    </button>
  </div>
  <div data-test="modal-body" class="px-6 py-4 text-gray-700"></div>
  <div class="flex justify-end gap-3 border-t border-gray-200 px-6 py-4">
    <a
            id="modal-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-500"
    >
      Читать полностью
    </a>
    <button
            type="button"
            data-modal-close
            class="rounded-lg bg-gray-600 px-4 py-2 font-semibold text-white hover:bg-gray-500"
    >
      Закрыть
    </button>
  </div>
</dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
